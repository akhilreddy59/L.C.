name: Sync LeetCode Submissions

on:
  workflow_dispatch: # Keeps the manual "Run workflow" button active
  schedule:
    - cron: "10 18 * * *" # Automatically runs every single night at 11:40 PM IST (6:10 PM UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: solutions
          verbose: true
